services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-efcore-pro
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LocalDev!123"
      MSSQL_PID: "Developer"
    ports:
      - "14333:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sqlserver-efcore-pro-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CommerceDb: "Server=sqlserver,1433;Database=CommercePro;User ID=sa;Password=LocalDev!123;TrustServerCertificate=True;Encrypt=False"
      Database__ApplyMigrations: "true"
      Database__SeedOnStartup: "true"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  mssql-data:
